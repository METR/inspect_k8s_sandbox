{{- range $name, $service := .Values.services }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "agentEnv.fullname" $ -}}-{{ $name }}
  labels:
    {{- include "agentEnv.labels" $ | nindent 4 }}
    inspect/service: {{ $name }}
  annotations:
    {{- toYaml $.Values.annotations | nindent 4 }}
spec:
  {{- /*
    Deliberately empty. The kubelet writes the pod's FQDN --
    <pod>.<subdomain>.<namespace>.svc.cluster.local -- into /etc/hosts, but only when
    the pod has a subdomain, and a StatefulSet's pods take their subdomain from
    serviceName. Left empty, the kubelet writes a plain "<pod IP> <pod name>" and the
    namespace stays out of the sandbox, where an agent under evaluation can read it.
    Nothing resolved the per-pod DNS name this would create: the Services below are
    what the coredns sidecar rewrites service names to.
  */}}
  serviceName: ""
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentEnv.selectorLabels" $ | nindent 6 }}
      inspect/service: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "agentEnv.labelsFromValues" $ | nindent 8 }}
        {{- include "agentEnv.selectorLabels" $ | nindent 8 }}
        {{- /* The StatefulSet gets this via helm.sh/chart; Pods don't, and knowing
               which chart version created a leaked Pod is useful when triaging. */}}
        aisi.gov.uk/k8s-sandbox-version: {{ $.Chart.Version | quote }}
        {{- if $service.networks }}
        {{- range $service.networks }}
        aisi.gov.uk/network-{{ . }}: "true"
        {{- end }}
        {{- end }}
        inspect/service: {{ $name }}
      {{- $podAnnotations := deepCopy (default (dict) $.Values.annotations) }}
      {{- range $key, $value := $service.podAnnotations }}
      {{- $_ := set $podAnnotations $key $value }}
      {{- end }}
      {{- $egressProxy := include "agentEnv.egressProxy" (dict "root" $ "service" $service) }}
      {{- if $egressProxy }}
      {{- $_ := set $podAnnotations "inspect-k8s-sandbox/egress-proxy" $egressProxy }}
      {{- /* The forwarder's key lets whoever holds it open streams as the forwarder: no container of the service may mount it. */}}
      {{- range concat (list $service) (default (list) $service.initContainers) }}
      {{- range .volumeMounts }}
      {{- if eq .name "egress-forwarder-key" }}{{ fail (printf "services.%s mounts the volume egress-forwarder-key, which holds the key of the pod's egress forwarder: no other container may read it" $name) }}{{ end }}
      {{- end }}
      {{- end }}
      {{- end }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      {{- /* An AWS Nitro Sandbox with no network device: the kubelet's HTTP probe can't reach a sidecar there. */}}
      {{- $noCard := eq (get $podAnnotations "sandbox.amazonaws.com/network-isolated") "true" }}
    spec:
      {{- /* "CLUSTER_DEFAULT" (magic string) prevents runtimeClassName being set. */}}
      {{- if ne $service.runtimeClassName "CLUSTER_DEFAULT" }}
      runtimeClassName: {{ $service.runtimeClassName | default "gvisor" }}
      {{- end }}
      automountServiceAccountToken: {{ $.Values.automountServiceAccountToken }}
      {{- if $.Values.serviceAccountName }}
      serviceAccountName: {{ $.Values.serviceAccountName | quote }}
      {{- end }}
      {{- /* Do not leak info on services via env vars */}}
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $service.terminationGracePeriodSeconds | default 0 | int64 }}
      {{- if $.Values.corednsUpstream }}
      {{- /* Replaces the resolv.conf subPath mount, which Kata Containers documents as unsupported. */}}
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
      {{- end }}
      {{- if and $noCard (include "shouldCreateDnsRecord" $service) }}
      {{- /* No sidecar answers there, so the service's own names lead to the pod itself. */}}
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - {{ $name | quote }}
            - {{ printf "%s-%s" (include "agentEnv.fullname" $) $name | quote }}
      {{- end }}

      {{- if or $service.initContainers $egressProxy }}
      initContainers:
      {{- if $egressProxy }}
        {{- /* First, and restarted if it ends: the init containers after it and the service use its port. */}}
        - name: egress-forwarder
          image: {{ required "set egressForwarderImage: a pod annotated inspect-k8s-sandbox/egress-proxy runs vsock-egress's forwarder" $.Values.egressForwarderImage | quote }}
          command: ["/vsock-egress", "forward", "-key", "/key/key"]
          restartPolicy: Always
          {{- /* The next container starts once the forwarder listens. An exec: no probe reaches a port of a pod with no network device. */}}
          startupProbe:
            exec:
              command: ["/vsock-egress", "ready", "-key", "/key/key"]
            periodSeconds: 1
            failureThreshold: 30
          volumeMounts:
            - name: egress-forwarder-key
              mountPath: /key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            {{- /* The runtime's default profile refuses the one thing the forwarder needs, socket(AF_VSOCK). */}}
            seccompProfile:
              type: Localhost
              localhostProfile: profiles/vsock-egress.json
      {{- end }}
      {{- range $service.initContainers }}
        - name: {{ .name }}
          image: {{ .image }}
          {{- if .imagePullPolicy }}
          imagePullPolicy: {{ .imagePullPolicy }}
          {{- end }}
          {{- if .command }}
          command:
{{ toYaml .command | nindent 12 }}
          {{- end }}
          {{- if .args }}
          args:
{{ toYaml .args | nindent 12 }}
          {{- end }}
          {{- if .workingDir }}
          workingDir: {{ .workingDir }}
          {{- end }}
          # This 'magic env var' has
          # to be accessible to the initContainers,
          # b/c the coredns container runs
          # after the initContainers.
          env:
            - name: AGENT_ENV
              value: "{{ template "agentEnv.fullname" $ }}"
          {{- range .env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
          {{- end }}
          {{- with .volumeMounts }}
          volumeMounts:
{{ toYaml . | nindent 12 }}
          {{- end }}
          {{- if .resources }}
          resources:
{{ toYaml .resources | nindent 12 }}
          {{- end }}
          {{- with .securityContext }}
          securityContext:
{{ toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      {{- end }}

      containers:
      - name: {{ $name }}
        image: {{ $service.image }}
        {{- if $service.imagePullPolicy }}
        imagePullPolicy: {{ $service.imagePullPolicy }}
        {{- end }}
        {{- if $service.command }}
        command:
          {{- toYaml $service.command | nindent 10 }}
        {{- end }}
        {{- if $service.args }}
        args:
          {{- toYaml $service.args | nindent 10 }}
        {{- end }}
        {{- if $service.workingDir }}
        workingDir: {{ $service.workingDir }}
        {{- end }}
        env:
          # Retained for service resolution backwards compatibility.
          - name: AGENT_ENV
            value: "{{ template "agentEnv.fullname" $ -}}"
        {{- if $service.env }}
          {{ range $service.env }}
          - name: {{ .name }}
            value: {{ .value | quote }}
          {{- end }}
        {{- end }}
        {{- with $service.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $service.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
        {{- if $service.resources }}
          {{- toYaml $service.resources | nindent 10 }}
        {{- else }}
          # Equal limits and requests for Guaranteed QoS class.
          limits:
            memory: "2Gi"
            cpu: "500m"
          requests:
            memory: "2Gi"
            cpu: "500m"
        {{- end }}
        volumeMounts:
        {{- with $service.volumeMounts }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- range $key, $value := $service.volumes }}
          {{- if kindIs "string" $value }}
            {{- $parts := split ":" $value }}
            {{- $volumeName := $parts._0 }}
            {{- $mountPath := $parts._1 }}
          - mountPath: {{ $mountPath | quote }}
            name: {{ template "agentEnv.fullname" $ -}}-{{ $volumeName }}
          {{- end }}
        {{- end }}
        {{- if not $.Values.corednsUpstream }}
          - name: resolv-conf
            mountPath: /etc/resolv.conf
            subPath: resolv.conf
        {{- end }}
        {{- with $service.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- if not $noCard }}
      - name: coredns
        image: {{ quote $.Values.corednsImage }}
        command:
          {{- toYaml $.Values.corednsCommand | nindent 10 }}
        securityContext:
          {{- toYaml $.Values.corednsSecurityContext | nindent 10 }}
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        ports:
          - containerPort: 53
            protocol: UDP
            name: dns
          - containerPort: 53
            protocol: TCP
            name: dns-tcp
          - containerPort: {{ $.Values.corednsReadyPort }}
            protocol: TCP
            name: dns-ready
        {{- /* Without it the sidecar counts as ready between crash-loop restarts. */}}
        startupProbe:
          httpGet:
            path: /ready
            port: dns-ready
          periodSeconds: 1
          failureThreshold: 30
        volumeMounts:
          {{- /* A directory mount, not subPath, which Kata Containers documents as unsupported. */}}
          - name: coredns-config
            mountPath: /etc/coredns
            readOnly: true
      {{- end }}
      {{- with $.Values.extraContainers }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with $service.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $service.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{- if not $noCard }}
        - name: coredns-config
          configMap:
            name: {{ template "agentEnv.fullname" $ -}}-coredns-configmap
      {{- end }}
      {{- if not $.Values.corednsUpstream }}
        - name: resolv-conf
          configMap:
            name: {{ template "agentEnv.fullname" $ -}}-resolv-conf
      {{- end }}
      {{- range $key, $value := $service.volumes }}
        {{- if kindIs "string" $value }}
          {{- $parts := split ":" $value }}
          {{- $volumeName := $parts._0 }}
        - name: {{ template "agentEnv.fullname" $ -}}-{{ $volumeName }}
          persistentVolumeClaim:
            claimName: {{ template "agentEnv.fullname" $ -}}-{{ $volumeName }}
        {{- else }}
        -  {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- if $egressProxy }}
        {{- /* Mounted by the forwarder alone: its key outlives a restart of it, and no other container reads it. */}}
        - name: egress-forwarder-key
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if include "shouldCreateDnsRecord" $service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "agentEnv.fullname" $ -}}-{{ $name }}
  annotations:
    {{- toYaml $.Values.annotations | nindent 4 }}
  labels:
    {{- toYaml $.Values.labels | nindent 4 }}
spec:
  # Make this a headless service: other pods in this agent-env may connect directly to
  # the pod on all ports. This enables the use of tools like `nc` on any port or `ping`
  # without Cilium blocking the traffic.
  clusterIP: None
  selector:
    {{- include "agentEnv.selectorLabels" $ | nindent 4 }}
    inspect/service: {{ $name }}
  {{- if $service.ports }}
  # ports are deprecated within this Helm chart. Maintained for backwards compatibility.
  ports:
    {{- range $service.ports }}
    - protocol: {{ .protocol }}
      port: {{ .port }}
      {{- /* A name is required when multiple ports are exposed. */}}
      name: port-{{ .port }}
    {{- end }}
  {{- end }}
---
{{- end }}
{{- end }}
