name: Test vsock-egress using Go

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vsock-egress
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: vsock-egress/go.sum
      - run: sudo modprobe vsock_loopback # without it the forwarder's tests would skip
      - run: go vet ./... && go test ./...
      # The tests that need root, from a directory any uid can reach and alone in a PID namespace: their reapers kill every process of a uid there.
      - run: mkdir -m 755 /tmp/ve && go test -c -o /tmp/ve/vsock-egress.test . && sudo unshare -pf --mount-proc /tmp/ve/vsock-egress.test -test.run 'TestOnlySandboxesThatNameAProxyAreWanted|TestWorkerRunsAsItsVMsUid|TestWorkerThatSignalsItsOwnUid|TestEndSaysWhenItsReaperFailed'
