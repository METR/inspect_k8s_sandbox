name: Test execd using Go

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false  # no go.sum to key it on
      - run: go vet ./... && go test ./...
        working-directory: execd
      # As root with a sandbox's few capabilities: the tests that run a command as another user need root.
      - run: >-
          docker run --rm --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add KILL
          --cap-add SETGID --cap-add SETUID --security-opt no-new-privileges -v "$PWD:/src:ro" -w /src
          public.ecr.aws/docker/library/golang:1.26-alpine@sha256:30b1e546a9c7fa3b747c2bdba3a0c7bdf3a02ebb4c5b8405d2f948d7e8aac4ec
          go test ./...
        working-directory: execd
      # As a user with no passwd entry, which an image's own user may be: execd still runs its commands.
      - run: >-
          docker run --rm --user 12345:12345 -e HOME=/tmp -e GOCACHE=/tmp/go -v "$PWD:/src:ro" -w /src
          public.ecr.aws/docker/library/golang:1.26-alpine@sha256:30b1e546a9c7fa3b747c2bdba3a0c7bdf3a02ebb4c5b8405d2f948d7e8aac4ec
          go test ./...
        working-directory: execd
