name: Test execd using Go

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false  # no go.sum to key it on
      - run: go vet ./... && go test ./...
        working-directory: execd
