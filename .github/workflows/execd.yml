name: Test execd using Go

on:
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false  # no go.sum to key it on
      - run: go vet ./... && go test -race ./...
        working-directory: execd
      - name: As root, for the tests that change user
        run: sudo env "PATH=$PATH" go test -race ./...
        working-directory: execd
