networks:
  tasknet: {}
services:
  isolated-service:
    image: my-isolated-image:1.0.0
    networkIsolated: true
    networks:
      - tasknet
  normal-service:
    image: my-normal-image:1.0.0
    networks:
      - tasknet
  ported-service: {image: my-image, networks: [tasknet], ports: [{protocol: TCP, port: 80}]}
