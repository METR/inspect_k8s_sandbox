# Unquoted, the newline in each value breaks the render or adds a field.
services:
  default:
    image: "img\nspliced: x"
    imagePullPolicy: "Always\nspliced: x"
    workingDir: "/w\nspliced: x"
    runtimeClassName: "gvisor\nspliced: x"
    env:
      - name: "ENVNAME\nspliced: x"
        value: "v"
    ports:
      - port: 80
        protocol: "TCP\nspliced: x"
    initContainers:
      - name: "init\nspliced: x"
        image: "iimg\nspliced: x"
        imagePullPolicy: "Always\nspliced: x"
        workingDir: "/iw\nspliced: x"
        env:
          - name: "IENVNAME\nspliced: x"
            value: "v"
allowDomains:
  - "pypi.org"
allowDomainsPorts:
  - port: 8008
    protocol: "TCP\nspliced: x"
  - port: 22
    protocol: "TCP\nspliced: x"
    domain: "pypi.org"
